  const tip = sph(0.018, skin); tip.position.set(0, 0.088, 0.118); tip.scale.set(1, 0.85, 1); head.add(tip);

  const sclera = new THREE.MeshPhysicalMaterial({ color: 0xf6f3ee, roughness: 0.25, clearcoat: 1, clearcoatRoughness: 0.05 });
  const irisM = new THREE.MeshStandardMaterial({ map: irisTex(o.irisC ?? ['#6b3f1d', '#3b2212']), roughness: 0.2 });
  const lashM = M(0x140c08, 0.6);
  for (const sd of [-1, 1]) {
    const eg = new THREE.Group(); eg.position.set(sd * 0.039, 0.125, 0.09); head.add(eg);
    const ew = sph(0.0205, sclera, 32, 24); eg.add(ew);
    const ig = new THREE.Group(); eg.add(ig);
    const ir = new THREE.Mesh(new THREE.CircleGeometry(0.0115, 32), irisM); ir.position.z = 0.0198; ig.add(ir);

    const low = new THREE.Mesh(new THREE.SphereGeometry(0.0222, 32, 16, 0, Math.PI * 2, Math.PI * 0.62, Math.PI * 0.38), skin); eg.add(low);
    P.eyes.push({ g: eg, ig }); P.lids.push(lid); P.lowLids.push(low);
  }
  P.brows = [];
  for (const sd of [-1, 1]) { const bg = new THREE.Group(); bg.position.set(sd * 0.04, 0.163, 0.1); head.add(bg); for (let i = 0; i < 5; i++) { const h = cap(0.0045, 0.012, hairA, 6); h.rotation.z = Math.PI / 2 + sd * (0.2 - i * 0.08); h.position.set(sd * (-0.018 + i * 0.009), -i * 0.0012 + (i === 1 || i === 2 ? 0.002 : 0), 0); bg.add(h); } P.brows.push(bg); }

  P.mouth = new THREE.Group(); P.mouth.position.set(0, 0.053, 0.1); head.add(P.mouth);
  P.cav = sph(0.017, M(0x3a0f0f, 0.8), 20, 14); P.cav.scale.set(1.3, 0.2, 0.5); P.mouth.add(P.cav);
  P.teeth = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.006, 0.006), M(0xf4f0e8, 0.3)); P.teeth.position.set(0, 0.006, 0.004); P.mouth.add(P.teeth);
  P.upLip = cap(0.0055, 0.03, lipM, 10); P.upLip.rotation.z = Math.PI / 2; P.upLip.position.set(0, 0.007, 0.006); P.mouth.add(P.upLip);
  P.loLip = new THREE.Mesh(new THREE.TorusGeometry(0.019, 0.0062, 10, 24, Math.PI), lipM); P.loLip.rotation.z = Math.PI; P.mouth.add(P.loLip);
  P.corners = []; for (const sd of [-1, 1]) { const c = sph(0.0028, lipM, 8, 6); c.position.set(sd * 0.021, 0.003, 0.002); P.mouth.add(c); P.corners.push(c); }

  for (const sd of [-1, 1]) {

    if (lt > 5.4 && lt < 8.8) { const up = seg(lt, 5.4, 5.9) * (1 - seg(lt, 8.4, 8.8)); ham.P.neck.rotation.x -= up * 0.55; ham.P.spine.rotation.x -= up * 0.2; }

    else look(2.9, 1.5, -2.6, 2.4, 0.1, -1.4, 40);

    pose(ham, { spine: [-0.1, 0, 0], head: [0.25, 0, 0], sh: [[-0.3, 0, 0.3], [-0.4, 0, 0.3]], el: [0.6, 0.6], grip: [0.8, 0.9], hip: [0.1, -0.1], kn: [0.15, 0.1] });

    holdProps(ham, false); mop.rotation.set(0, 0, 0.15);
    const op = seg(lt, 0.2, 2.2);
    planet.lidPivot.rotation.x = -op * 1.9; planet.dust.material.opacity = 0.05;
    planet.pit.material.emissiveIntensity = op * 3.5; planet.beamM.opacity = op * 0.18; planet.upL.intensity = op * 120;
    const k = seg(lt, 0, 7.8);
    look(lerp(4.2, 3.0, k), lerp(1.4, 1.55, k), lerp(4.4, 3.6, k), 2.4, lerp(0.7, 0.8, k), -1.4, lerp(44, 40, k));
  } else { useScene(voidS); }
  faceFill.forEach(L => { L.position.copy(camera.position).add(new THREE.Vector3(0.4, 0.3, 0)); L.intensity = 1.6 * clamp((FOCUS - 0.15) / 1.5, 0.02, 1); });
  if (bokeh) { bokeh.uniforms.focus.value = FOCUS; bokeh.uniforms.aperture.value = APERTURE; }

}

// ---------------- 2D overlays ----------------
function rr(x, y, w, h, r, fill, stroke, lw) { o2.beginPath(); o2.roundRect(x, y, w, h, r); if (fill) { o2.fillStyle = fill; o2.fill(); } if (stroke) { o2.strokeStyle = stroke; o2.lineWidth = lw || 4; o2.stroke(); } }
function txt(s, x, y, size, weight, color, align, font, ls) { o2.font = `${weight} ${size}px ${font || BODY}`; o2.fillStyle = color; o2.textAlign = align || 'left'; o2.textBaseline = 'alphabetic'; o2.letterSpacing = (ls || 0) + 'px'; o2.fillText(s, x, y); o2.letterSpacing = '0px'; }
function outlined(s, x, y, size, fill, stroke, lw, font) { o2.font = `900 ${size}px ${font || DISP}`; o2.textAlign = 'center'; o2.lineJoin = 'round'; o2.lineWidth = lw; o2.strokeStyle = stroke; o2.strokeText(s, x, y); o2.fillStyle = fill; o2.fillText(s, x, y); }

  o2.restore();
}
function tag(t, t0, t1, s) {
  if (t < t0 || t > t1) return;
  const a = seg(t, t0 + 0.1, t0 + 0.5) * (1 - seg(t, t1 - 0.3, t1));
  o2.save(); o2.globalAlpha = a; o2.font = `700 34px ${BODY}`; const w = o2.measureText(s).width + 60;
  rr(60, 250, w, 64, 12, 'rgba(10,14,22,0.6)'); o2.fillStyle = '#ffd166'; o2.fillRect(60, 250, 8, 64); txt(s, 90, 294, 34, 700, '#fff', 'left'); o2.restore();
}
function subtitles(t) {
  const s = SUBS.find(x => t >= x.start - 0.05 && t <= x.end + 0.3); if (!s) return;
  const a = seg(t, s.start - 0.05, s.start + 0.15) * (1 - seg(t, s.end + 0.1, s.end + 0.3));
  o2.save(); o2.globalAlpha = a; o2.font = `700 44px ${BODY}`;
  const lines = wrap(s.text, 900), h = lines.length * 58 + 34, y0 = 1640 - h / 2, w = Math.max(...lines.map(l => o2.measureText(l).width)) + 60;
  rr(W / 2 - w / 2, y0, w, h, 18, 'rgba(0,0,0,0.62)');
  lines.forEach((l, i) => txt(l, W / 2, y0 + 62 + i * 58, 44, 700, '#fff', 'center'));
  o2.restore();
}
function letterbox(a) { o2.fillStyle = `rgba(0,0,0,${a})`; o2.fillRect(0, 0, W, 150); o2.fillRect(0, H - 120, W, 120); }
function grain(t, amt) {
  o2.save(); o2.globalAlpha = amt; for (let i = 0; i < 900; i++) { const v = (i * 7919 + Math.floor(t * 30) * 104729) % 1000 / 1000; o2.fillStyle = v > 0.5 ? '#fff' : '#000'; o2.fillRect(((i * 3571 + Math.floor(t * 30) * 2797) % W), ((i * 6007 + Math.floor(t * 30) * 4421) % H), 2, 2); } o2.restore();
}
function vignette(s) { const g = o2.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${s})`); o2.fillStyle = g; o2.fillRect(0, 0, W, H); }
function bubble(x, y, text, t0, t, col) {
  const k = backOut((t - t0) / 0.3); if (k <= 0) return;
  o2.save(); o2.translate(x, y); o2.scale(k, k); o2.font = `800 46px ${BODY}`; const w = Math.min(900, o2.measureText(text).width + 60);
  rr(-w / 2, -50, w, 84, 30, 'rgba(255,255,255,0.95)'); o2.fillStyle = 'rgba(255,255,255,0.95)'; o2.beginPath(); o2.moveTo(-20, 32); o2.lineTo(-40, 66); o2.lineTo(10, 32); o2.fill();
  txt(text, 0, 8, 46, 800, col || '#1d2433', 'center'); o2.restore();
}


// ---------------- overlays ----------------
function subtitles2(t) {
  const s = SUBS.find(x => t >= x.start - 0.05 && t <= x.end + 0.3); if (!s) return;
  const a = seg(t, s.start - 0.05, s.start + 0.15) * (1 - seg(t, s.end + 0.1, s.end + 0.3));
  const col = s.voice === 'ham' ? '#ffd166' : s.voice === 'myst' ? '#9ff6ff' : '#fff';
  const font = s.voice === 'myst' ? `italic 700 46px ${BODY}` : `700 44px ${BODY}`;
  o2.save(); o2.globalAlpha = a; o2.font = font;
  const label = s.voice === 'ham' ? 'HAMSİCAN: ' : s.voice === 'myst' ? '??? : ' : '';
  const text = label + s.text;
  const lines = wrap(text, 900), h = lines.length * 58 + 34, y0 = 1640 - h / 2, w = Math.max(...lines.map(l => o2.measureText(l).width)) + 60;
  rr(W / 2 - w / 2, y0, w, h, 18, 'rgba(0,0,0,0.62)');
  lines.forEach((l, i) => { o2.fillStyle = col; o2.textAlign = 'center'; o2.fillText(l, W / 2, y0 + 62 + i * 58); });
  o2.restore();
}
function floatingTitle(t, t0, t1, text, y, size, sub) {
  if (t < t0 || t > t1) return;
  const a = seg(t, t0, t0 + 0.9) * (1 - seg(t, t1 - 0.6, t1));
  const k = (t - t0) / (t1 - t0);
  o2.save(); o2.globalAlpha = a; o2.translate(W / 2, y);
  const sc = 0.82 + k * 0.38; o2.scale(sc, sc);
  o2.font = `300 ${size}px ${DISP}`; o2.textAlign = 'center';
  const letters = [...text]; let total = 0; const widths = letters.map(ch => { const w = o2.measureText(ch).width + 18; total += w; return w; });
  let x = -total / 2;
  letters.forEach((ch, i) => {
    const dz = Math.sin(i * 1.7 + t * 0.6) * 10 * (1 - k * 0.5), dy = Math.cos(i * 2.3 + t * 0.5) * 6;
    o2.shadowColor = 'rgba(190,220,255,0.75)'; o2.shadowBlur = 30; o2.fillStyle = '#f2f6ff';
    o2.fillText(ch, x + widths[i] / 2 + dz, dy); x += widths[i];
  });
  o2.restore();
  if (sub) { o2.save(); o2.globalAlpha = a * 0.8; txt(sub, W / 2, y + 120, 34, 500, '#b8c4d6', 'center', BODY, 8); o2.restore(); }
}
function staticNoise(amt) {
  const img = o2.getImageData(0, 0, W, H), d = img.data;
  for (let y = 0; y < H; y += 2) { const sh = Math.random() < 0.06 ? Math.floor((Math.random() - 0.5) * 120 * amt) : 0;
    for (let x = 0; x < W; x += 2) { const i = (y * W + x) * 4, n = Math.random() * 255 * amt; const j = (y * W + Math.min(W - 1, Math.max(0, x + sh))) * 4; d[i] = d[j] * (1 - amt) + n; d[i + 1] = d[j + 1] * (1 - amt) + n; d[i + 2] = d[j + 2] * (1 - amt) + n; } }
  o2.putImageData(img, 0, 0);
}
function overlays(t) {
  if (t >= 18.3 && t < 25.6) { // flashback treatment
    o2.save(); o2.globalCompositeOperation = 'saturation'; o2.fillStyle = 'rgba(128,128,128,0.65)'; o2.fillRect(0, 0, W, H); o2.restore();
    o2.fillStyle = 'rgba(255,230,190,0.08)'; o2.fillRect(0, 0, W, H);
    if (t > 18.6 && t < 22.6) { const n = Math.min(12, Math.floor((t - 18.6) * 9)); txt('SAATLER ÖNCE'.slice(0, n), 80, 320, 54, 700, '#fff', 'left', MONO, 8); }
    if (t > 20.5 && t < 23.4) { const c = Math.max(1, 3 - Math.floor((t - 20.6) / 0.9)); o2.save(); o2.shadowColor = 'rgba(0,0,0,0.6)'; o2.shadowBlur = 20; txt(t < 23.0 ? String(c) : 'ATEŞLE', W / 2, 980, t < 23.0 ? 240 : 120, 900, '#ffd166', 'center', DISP); o2.restore(); }
    if (t > 23.4) { staticNoise(Math.min(0.85, (t - 23.4) * 0.9)); txt('SİNYAL YOK', W / 2, 980, 110, 900, '#ff4d6d', 'center', MONO, 6); }
  }
  vignette(t < 4.6 ? 0.8 : 0.6);
  if (t >= 4.6 && t < 8.0) { o2.fillStyle = '#000'; o2.fillRect(0, 0, W, H); floatingTitle(t, 4.7, 8.0, 'UZAY PASPASI', 960, 128, 'PASPASLI DİPLOMAT · 2. SEZON · 2. BÖLÜM'); }
  if (t > 8.2 && t < 12.6) { const a = seg(t, 8.2, 8.8) * (1 - seg(t, 12.0, 12.6)); o2.save(); o2.globalAlpha = a; txt('BİLİNMEYEN GEZEGEN', 80, 300, 40, 700, '#e8dcff', 'left', MONO, 6); txt('Kova-1 kaza bölgesi · sinyal: yok', 80, 350, 30, 500, '#b9a8e6', 'left', MONO, 2); o2.restore(); }
  if (t > 51.0 && t < 52.4) { o2.fillStyle = `rgba(255,248,230,${seg(t, 51.0, 52.0)})`; o2.fillRect(0, 0, W, H); }
  if (t >= 52.2) { o2.fillStyle = '#000'; o2.fillRect(0, 0, W, H); floatingTitle(t, 52.4, 60, 'UZAY PASPASI', 900, 96, null);
    const a = seg(t, 53.6, 54.4); o2.save(); o2.globalAlpha = a * (1 - seg(t, 59.3, 60)); txt('DEVAM EDECEK', W / 2, 1060, 44, 700, '#ffd166', 'center', BODY, 12); txt('Bölüm 3 · Kapağın Altında', W / 2, 1130, 34, 500, '#b8c4d6', 'center', BODY, 4); o2.restore(); }
  subtitles2(t);
  // hard cuts with a 'whoosh' flash
  for (const c of [18.3, 25.6]) { const d = Math.abs(t - c); if (d < 0.22) { o2.fillStyle = `rgba(255,255,255,${(1 - d / 0.22) * 0.95})`; o2.fillRect(0, 0, W, H); } }
  for (const c of [4.6, 8.0, 33.4, 44.2]) { const d = Math.abs(t - c); if (d < 0.25) { o2.fillStyle = `rgba(0,0,0,${(1 - d / 0.25)})`; o2.fillRect(0, 0, W, H); } }

function renderFrame(i) {

  else if (window.MB) { render3D(t - 1 / 90); o2.globalAlpha = 1; o2.drawImage(renderer.domElement, 0, 0, W, H); render3D(t); o2.globalAlpha = 0.5; o2.drawImage(renderer.domElement, 0, 0, W, H); o2.globalAlpha = 1; }

window.VIDEO = { FPS, DUR, NF };

await document.fonts.ready;

if (location.hash !== '#render') {
  let start = null;
