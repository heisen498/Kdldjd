// ---------------- 3D scene timeline ----------------
function alarm(t, on) {
  hall.reds.forEach(({ rl, bulb, sd }) => {
    const a = t * 3.2 + (sd > 0 ? Math.PI : 0);
    rl.intensity = on ? 220 : 0; bulb.material.emissiveIntensity = on ? 3 + 2 * Math.sin(t * 12) : 0;
    rl.target.position.set(Math.cos(a) * 4, 0, -2 + Math.sin(a) * 4);
  });
}
function hallDefaults() {
  ham.root.visible = false; thief.root.visible = false; thiefBucket.visible = false; blueBucket.visible = false; mop.visible = false; mag.visible = false;
  hall.goldBucket.visible = false; hall.fpGroup.visible = false; hall.dust.material.opacity = 0; hall.beamM.opacity = 0; hall.spot.intensity = 60; hall.moon.intensity = 1.2; hall.warm.intensity = 0; hall.hemi.intensity = 0.18; hall.glass.visible = true; hall.edges.visible = true;
}
function render3D(t) {
  if (t < 4.6) { // title: golden bucket on pedestal
    useScene(hall.s); hallDefaults(); alarm(t, false);
    hall.goldBucket.visible = true; hall.goldBucket.rotation.y = t * 0.6; hall.goldBucket.position.set(0, 1.21 + Math.sin(t * 2) * 0.01, -1);
    hall.spot.intensity = 35; hall.moon.intensity = 0.3; hall.warm.intensity = 4; hall.hemi.intensity = 0.04; hall.glass.visible = false; hall.edges.visible = false;
    const a = t * 0.15;
    look(Math.sin(a) * 1.7, 1.55, -1 + Math.cos(a) * 1.7, 0, 1.28, -1, 36);
  } else if (t < 11.2) { // empty vitrine, alarm
    const lt = t - 4.6;
    useScene(hall.s); hallDefaults(); alarm(t, lt > 2.4);
    const k = seg(lt, 0, 6.6);
    look(lerp(2.4, 0.7, k), lerp(1.5, 1.5, k), lerp(6.0, 1.6, k), 0, 1.2, -1, 42);
  } else if (t < 21.4) { // Hamsican investigates
    const lt = t - 11.2;
    useScene(hall.s); hallDefaults(); alarm(t, true);
    ham.root.visible = true; hall.fpGroup.visible = true;
    const glow = seg(lt, 6.8, 7.6);
    hall.fpM.emissiveIntensity = 0.15 + glow * 2.5;
    hall.dust.material.opacity = 0.15 + glow * 0.85;
    const pa = hall.dust.geometry.attributes.position;
    hall.dustBase.forEach(([x, y, z, ph], i) => pa.setXYZ(i, x + Math.sin(t + ph) * 0.03, y + ((t * 0.08 + ph) % 0.6) * glow, z));
    pa.needsUpdate = true;
    let p;
    if (lt < 2.0) { // run in
      const k = lt / 2.0; ham.root.position.set(lerp(-3.5, -0.5, k), 0, lerp(4.5, 2.4, k)); ham.root.rotation.y = 0.9 - k * 0.5;
      p = walkPose(lt * 11, 0.75, true); setFace(ham, 'determined', t);
    } else if (lt < 2.8) { // stop & look
      ham.root.position.set(-0.5, 0, 2.4); ham.root.rotation.y = 0.4 - seg(lt, 2, 2.8) * 0.5;
      p = { head: [0.2, 0, 0], sh: [[0, 0, 0.1], [0, 0, 0.1]] }; setFace(ham, 'shock', t);
    } else { // kneel with magnifier
      const k = seg(lt, 2.8, 3.6);
      ham.root.position.set(-0.5, 0, 2.4); ham.root.rotation.y = 0.55;
      p = { hipsY: lerp(0.93, 0.52, k), spine: [lerp(0, 0.45, k), 0, 0], head: [lerp(0, 0.35, k), 0, 0],
            hip: [lerp(0, 1.5, k), lerp(0, 0.2, k)], kn: [lerp(0, 2.3, k), lerp(0, 2.2, k)], ft: [lerp(0, -0.8, k), lerp(0, 0.6, k)], hipZ: [0, 0],
            sh: [[lerp(0, -1.0, k), 0, 0.1], [lerp(0, -0.5, k), 0, 0.15]], el: [lerp(0.15, 0.9, k), lerp(0.15, 1.1, k)] };
      // knee down for right leg
      p.hip[1] = lerp(0, -0.1, k); p.kn[1] = lerp(0, 1.9, k);
      setFace(ham, lt > 7.2 ? 'shock' : 'focus', t);
      ham.look = [0, -1];
      mag.visible = k > 0.5;
    }
    pose(ham, p);
    if (mag.visible) { attachTo(mag, ham.P.hand[1], new THREE.Vector3(0.02, 0.06, 0.06)); mag.rotation.set(-1.0, 0.2, 0); }
    // camera
    const R = ham.root.position;
    if (lt < 2.8) look(R.x + 1.6, 1.45, R.z + 3.4, R.x, 0.95, R.z - 0.2, 48);
    else { const k = seg(lt, 2.8, 4.6), k2 = seg(lt, 6.6, 8.0) * 0.35; look(R.x + lerp(1.6, 1.25, k) - k2 * 0.35, lerp(1.45, 0.95, k) - k2 * 0.25, R.z + lerp(3.4, 2.1, k) - k2 * 0.5, R.x + 0.1, lerp(0.95, 0.45, k) - k2 * 0.15, R.z - lerp(0.2, 0.5, k), lerp(48, 44, k)); }
  } else if (t < 28.6) { // CCTV
    const lt = t - 21.4;
    useScene(hall.s); hallDefaults(); alarm(t, false);
    hall.goldBucket.visible = lt < 3.4;
    thief.root.visible = true;
    const k = seg(lt, 0.3, 3.2), k2 = seg(lt, 3.8, 6.8);
    thief.root.position.set(lerp(-3.5, -0.45, k), lerp(0.4, 0.2, k) + Math.sin(t * 1.5) * 0.06 + k2 * 6, lerp(3, -0.6, k) - k2 * 0.4);
    thief.root.rotation.set(Math.sin(t * 0.8) * 0.12, lerp(0.9, 0.5, k), Math.sin(t * 0.6) * 0.15);
    pose(thief, { hipsY: 0.93, spine: [0.1, 0, 0], head: [0.1, 0, 0], hip: [0.4 + Math.sin(t) * 0.1, 0.2], kn: [0.6, 0.5], sh: [[lt > 2.6 && lt < 3.6 ? -1.2 : -0.5, 0, 0.3], [-0.3, 0, 0.5]], el: [0.4, 0.6] });
    setFace(thief, 'happy', t);
    if (lt > 3.4) { thiefBucket.visible = true; attachTo(thiefBucket, thief.P.hand[0], new THREE.Vector3(0, -0.12, 0)); thiefBucket.rotation.set(0, 0, 0); }
    look(2.6, 3.4, 3.2, -0.3, 1.0 + seg(lt, 3.8, 6.8) * 1.2, -0.6, 58);
  } else if (t < 35.4) { // remembering under the skylight
    const lt = t - 28.6;
    useScene(hall.s); hallDefaults(); alarm(t, false);
    ham.root.visible = true; hall.beamM.opacity = 0.05;
    ham.root.position.set(0.3, 0, 0.6); ham.root.rotation.y = -0.4;
    pose(ham, { head: [-0.55 * seg(lt, 0.3, 1.5), 0.2, 0], sh: [[0, 0, 0.05], [-0.4, 0, 0.1]], el: [0.15, 1.6] });
    setFace(ham, lt > 3.2 ? 'sad' : 'think', t); ham.look = [0, 1];
    const k = seg(lt, 0, 6.8);
    look(lerp(1.4, 1.1, k), lerp(1.2, 1.0, k), lerp(2.2, 1.8, k), 0.25, lerp(1.6, 1.75, k), 0.5, 36);
  } else if (t < 43.8) { // space station call
    const lt = t - 35.4;
    useScene(station.s);
    friend.root.position.set(0, 0.9 + Math.sin(t * 0.9) * 0.08, -1.2); friend.root.rotation.set(Math.sin(t * 0.5) * 0.08, 0.15 + Math.sin(t * 0.3) * 0.1, Math.sin(t * 0.7) * 0.06);
    const shake = lt > 2.2 ? Math.sin(t * 7) * 0.35 : 0;
    pose(friend, { spine: [0.05, 0, 0], head: [0, 0.1, 0], hip: [0.5, 0.25], kn: [0.7, 0.5], sh: [[-1.6 + shake, 0, 0.2], [-0.3, 0, 0.6]], el: [0.6, 0.5] });
    setFace(friend, lt > 1.6 && lt < 6.8 ? 'talk' : 'happy', t);
    attachTo(friendBucket, friend.P.hand[0], new THREE.Vector3(0, 0.1, 0.05)); friendBucket.rotation.set(0.2, t * 0.3, 0.1);
    station.props.forEach(({ m, p, ph }) => { m.position.set(p[0] + Math.sin(t * 0.4 + ph) * 0.2, p[1] + Math.cos(t * 0.5 + ph) * 0.2, p[2]); m.rotation.set(t * 0.3 + ph, t * 0.4, 0); });
    station.earth.rotation.y = t * 0.01;
    const k = seg(lt, 0, 8.4);
    look(lerp(0.9, 0.5, k), lerp(1.9, 1.85, k), lerp(2.6, 1.9, k), 0, 1.7, -1.4, 46);
  } else if (t < 50.2) { // bucket helmet, heroic
    const lt = t - 43.8;
    useScene(hall.s); hallDefaults(); alarm(t, false);
    ham.root.visible = true; blueBucket.visible = true; mop.visible = true; hall.beamM.opacity = 0.09; hall.spot.intensity = 30; hall.moon.intensity = 2.2;
    ham.root.position.set(0, 0, 0.4); ham.root.rotation.y = 0;
    const lift = seg(lt, 0.4, 2.0), mopK = seg(lt, 2.4, 3.4);
    pose(ham, { spine: [-0.05, 0, 0], head: [-0.05, 0, 0], sh: [[lerp(-0.6, -2.7, lift) * (1 - seg(lt, 2.0, 2.4)) + lerp(0, -0.3, seg(lt, 2.0, 2.4)), 0, lerp(0.3, 0.5, lift)], [lerp(0, -2.6, mopK) * 0.55, 0, 0.25 + mopK * 0.2]],
      el: [lerp(0.5, 0.6, lift), lerp(0.2, 2.0, mopK)], hip: [0.05, -0.05], hipZ: [-0.08, 0.08] });
    setFace(ham, 'determined', t);
    if (lt < 2.0) { attachTo(blueBucket, ham.P.hand[0], new THREE.Vector3(0, 0.12, 0)); blueBucket.rotation.set(Math.PI * lift, 0, 0); }
    else { ham.P.head.updateWorldMatrix(true, false); ham.P.head.getWorldPosition(tmpV); blueBucket.position.copy(tmpV).add(new THREE.Vector3(0, 0.2, 0)); blueBucket.rotation.set(Math.PI, 0, 0.06); }
    attachTo(mop, ham.P.hand[1], new THREE.Vector3(0, 0, 0)); mop.rotation.set(0, 0, lerp(0.1, 2.6, mopK));
    const k = seg(lt, 0, 6.4);
    look(lerp(0.7, 1.0, k), lerp(0.55, 0.8, k), lerp(4.2, 3.4, k), 0, lerp(1.25, 1.4, k), 0.4, 44);
  } else { // launch pad at dawn
    const lt = t - 50.2;
    useScene(launch.s);
    ham2.root.position.set(lerp(-2, -0.8, seg(lt, 0, 3)), 0.3, lerp(14, 9, seg(lt, 0, 3)));
    ham2.root.rotation.y = Math.PI;
    pose(ham2, lt < 3 ? walkPose(lt * 7, 0.45, false) : { head: [-0.6, 0, 0], sh: [[0, 0, 0.05], [-2.5, 0, 0.3]], el: [0.2, 2.0] });
    setFace(ham2, 'determined', t);
    ham2.P.head.updateWorldMatrix(true, false); ham2.P.head.getWorldPosition(tmpV); ham2Bucket.position.copy(tmpV).add(new THREE.Vector3(0, 0.2, 0)); ham2Bucket.rotation.set(Math.PI, 0, 0);
    attachTo(ham2Mop, ham2.P.hand[1], new THREE.Vector3()); ham2Mop.rotation.set(0, 0, 2.6);
    launch.smokes.forEach(({ sp, ph, a }) => { const k = (t * 0.12 + ph) % 1; sp.position.set(Math.cos(a) * (3 + k * 10), 0.8 + k * 6, Math.sin(a) * (3 + k * 10)); sp.scale.setScalar(3 + k * 9); sp.material.opacity = 0.35 * (1 - k); });
    const k = seg(lt, 0.5, 8.5);
    look(lerp(-1.2, 6, k), lerp(1.2, 3, k), lerp(16.5, 30, k), lerp(-0.8, 0, k), lerp(1.3, 22, k), lerp(9, 0, k), lerp(40, 55, k));
  }
  composer.render();
}

// ---------------- 2D overlays ----------------
function rr(x, y, w, h, r, fill, stroke, lw) { o2.beginPath(); o2.roundRect(x, y, w, h, r); if (fill) { o2.fillStyle = fill; o2.fill(); } if (stroke) { o2.strokeStyle = stroke; o2.lineWidth = lw || 4; o2.stroke(); } }
function txt(s, x, y, size, weight, color, align, font, ls) { o2.font = `${weight} ${size}px ${font || BODY}`; o2.fillStyle = color; o2.textAlign = align || 'left'; o2.textBaseline = 'alphabetic'; o2.letterSpacing = (ls || 0) + 'px'; o2.fillText(s, x, y); o2.letterSpacing = '0px'; }
function outlined(s, x, y, size, fill, stroke, lw, font) { o2.font = `900 ${size}px ${font || DISP}`; o2.textAlign = 'center'; o2.lineJoin = 'round'; o2.lineWidth = lw; o2.strokeStyle = stroke; o2.strokeText(s, x, y); o2.fillStyle = fill; o2.fillText(s, x, y); }
function wrap(text, maxW) { const ws = text.split(' '), ls = []; let c = ''; for (const w of ws) { const n = c ? c + ' ' + w : w; if (o2.measureText(n).width > maxW && c) { ls.push(c); c = w; } else c = n; } if (c) ls.push(c); return ls; }
function cinemaText(t, t0, t1, big, small, y) {
  if (t < t0 || t > t1) return;
  const a = seg(t, t0, t0 + 0.5) * (1 - seg(t, t1 - 0.4, t1));
  o2.save(); o2.globalAlpha = a;
  o2.shadowColor = 'rgba(0,0,0,0.6)'; o2.shadowBlur = 24;
  txt(big, W / 2, y, 110, 900, '#fff', 'center', DISP, 2);
  if (small) txt(small, W / 2, y + 80, 48, 600, '#ffd166', 'center', BODY, 6);
  o2.restore();
}
function tag(t, t0, t1, s) {
  if (t < t0 || t > t1) return;
  const a = seg(t, t0 + 0.1, t0 + 0.5) * (1 - seg(t, t1 - 0.3, t1));
  o2.save(); o2.globalAlpha = a; o2.font = `700 34px ${BODY}`; const w = o2.measureText(s).width + 60;
  rr(60, 250, w, 64, 12, 'rgba(10,14,22,0.6)'); o2.fillStyle = '#ffd166'; o2.fillRect(60, 250, 8, 64); txt(s, 90, 294, 34, 700, '#fff', 'left'); o2.restore();
}
function subtitles(t) {
  const s = SUBS.find(x => t >= x.start - 0.05 && t <= x.end + 0.3); if (!s) return;
  const a = seg(t, s.start - 0.05, s.start + 0.15) * (1 - seg(t, s.end + 0.1, s.end + 0.3));
  o2.save(); o2.globalAlpha = a; o2.font = `700 44px ${BODY}`;
  const lines = wrap(s.text, 900), h = lines.length * 58 + 34, y0 = 1640 - h / 2, w = Math.max(...lines.map(l => o2.measureText(l).width)) + 60;
  rr(W / 2 - w / 2, y0, w, h, 18, 'rgba(0,0,0,0.62)');
  lines.forEach((l, i) => txt(l, W / 2, y0 + 62 + i * 58, 44, 700, '#fff', 'center'));
  o2.restore();
}
function letterbox(a) { o2.fillStyle = `rgba(0,0,0,${a})`; o2.fillRect(0, 0, W, 150); o2.fillRect(0, H - 120, W, 120); }
function grain(t, amt) {
  o2.save(); o2.globalAlpha = amt; for (let i = 0; i < 900; i++) { const v = (i * 7919 + Math.floor(t * 30) * 104729) % 1000 / 1000; o2.fillStyle = v > 0.5 ? '#fff' : '#000'; o2.fillRect(((i * 3571 + Math.floor(t * 30) * 2797) % W), ((i * 6007 + Math.floor(t * 30) * 4421) % H), 2, 2); } o2.restore();
}
function vignette(s) { const g = o2.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.75); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${s})`); o2.fillStyle = g; o2.fillRect(0, 0, W, H); }
function bubble(x, y, text, t0, t, col) {
  const k = backOut((t - t0) / 0.3); if (k <= 0) return;
  o2.save(); o2.translate(x, y); o2.scale(k, k); o2.font = `800 46px ${BODY}`; const w = Math.min(900, o2.measureText(text).width + 60);
  rr(-w / 2, -50, w, 84, 30, 'rgba(255,255,255,0.95)'); o2.fillStyle = 'rgba(255,255,255,0.95)'; o2.beginPath(); o2.moveTo(-20, 32); o2.lineTo(-40, 66); o2.lineTo(10, 32); o2.fill();
  txt(text, 0, 8, 46, 800, col || '#1d2433', 'center'); o2.restore();
}

function overlays(t) {
  // global cinematic look
  vignette(0.55);
  if (t < 4.6) {
    const k1 = backOut((t - 0.3) / 0.6), k2 = seg(t, 1.0, 1.6);
    o2.save(); o2.translate(W / 2, 470); o2.scale(k1, k1); o2.shadowColor = 'rgba(255,190,60,0.7)'; o2.shadowBlur = 40;
    txt('2. SEZON', 0, 0, 150, 900, '#ffd166', 'center', DISP, 8); o2.restore();
    o2.save(); o2.globalAlpha = k2; txt('PASPASLI DİPLOMAT', W / 2, 330, 54, 800, '#fff', 'center', BODY, 10);
    txt('Bölüm 1 · Kayıp Kova', W / 2, 580, 60, 700, '#fff', 'center', BODY, 2); o2.restore();
  }
  tag(t, 4.6, 11.2, 'Dışişleri · İttifak Müzesi · 00:04');
  if (t > 7.0 && t < 11.2) { const k = backOut((t - 7.0) / 0.4); o2.save(); o2.translate(W / 2, 520); o2.scale(k, k); rr(-320, -80, 640, 120, 16, 'rgba(180,10,30,0.85)'); txt('⚠ KOVA KAYIP', 0, 8, 72, 900, '#fff', 'center', DISP, 4); o2.restore(); }
  if (t > 18.4 && t < 21.4) { const k = backOut((t - 18.4) / 0.4); o2.save(); o2.translate(W / 2, 560); o2.scale(k, k); o2.shadowColor = 'rgba(80,240,255,0.9)'; o2.shadowBlur = 40; txt('UZAY TOZU', 0, 0, 120, 900, '#bff8ff', 'center', DISP, 6); o2.restore(); }
  if (t >= 21.4 && t < 28.6) {
    // CCTV look
    const img = o2.getImageData(0, 0, W, H); const d = img.data;
    for (let i = 0; i < d.length; i += 4) { const v = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11; const g = Math.min(255, v * 1.15 + 6); d[i] = g * 0.92; d[i + 1] = g; d[i + 2] = g * 0.92; }
    o2.putImageData(img, 0, 0);
    o2.fillStyle = 'rgba(0,0,0,0.18)'; for (let y = 0; y < H; y += 4) o2.fillRect(0, y, W, 2);
    grain(t, 0.25);
    const sec = Math.floor((t - 21.4) * 1) + 7;
    txt('CAM 04 · İTTİFAK MÜZESİ', 60, 300, 40, 700, '#fff', 'left', MONO);
    txt(`13.11.2026  02:13:${String(sec).padStart(2, '0')}`, 60, 350, 36, 700, '#fff', 'left', MONO);
    if (Math.sin(t * 6) > 0) { o2.fillStyle = '#ff2d2d'; o2.beginPath(); o2.arc(940, 290, 16, 0, 7); o2.fill(); txt('REC', 970, 302, 36, 700, '#fff', 'left', MONO); }
  }
  if (t > 28.6 && t < 35.4) {
    const k = seg(t, 30.4, 31.0) * (1 - seg(t, 34.9, 35.4));
    if (k > 0) { o2.save(); o2.globalAlpha = k; rr(90, 330, 900, 300, 20, 'rgba(70,50,30,0.82)'); o2.fillStyle = 'rgba(255,220,160,0.12)'; for (let y = 330; y < 630; y += 5) o2.fillRect(90, y, 900, 2);
      txt('▶ 2026 · Uzay istasyonu', 130, 390, 34, 700, '#ffd9a0', 'left', MONO); txt('"Keşke ben de kalsaydım..."', W / 2, 520, 56, 700, '#fff', 'center', BODY); o2.restore(); }
  }
  if (t >= 35.4 && t < 43.8) {
    // video call UI
    const a = seg(t, 35.5, 35.9);
    o2.save(); o2.globalAlpha = a;
    rr(40, 210, W - 80, 110, 24, 'rgba(10,14,22,0.6)');
    o2.fillStyle = '#06d6a0'; o2.beginPath(); o2.arc(110, 265, 14, 0, 7); o2.fill();
    txt('Makif\'li Astronot', 140, 260, 40, 800, '#fff', 'left'); txt(`Görüntülü arama · 00:${String(Math.floor(t - 35.4) + 12).padStart(2, '0')}`, 140, 300, 30, 500, '#cfd8dc', 'left');
    rr(760, 1270, 260, 360, 20, '#2b3a55', '#fff', 4); txt('Hamsican', 890, 1610, 28, 700, '#fff', 'center');
    o2.fillStyle = '#7ec8e3'; o2.beginPath(); o2.arc(890, 1480, 70, Math.PI, 0); o2.fill(); o2.fillStyle = '#f0c09a'; o2.beginPath(); o2.arc(890, 1380, 52, 0, 7); o2.fill(); o2.fillStyle = '#3a2619'; o2.beginPath(); o2.arc(890, 1362, 54, Math.PI, 0); o2.fill();
    o2.restore();
    if (t > 37.6 && t < 42.8) bubble(W / 2, 470, 'Burada temizlik yapacak kimse yok!', 37.6, t, '#1d3557');
  }
  if (t > 46.4 && t < 50.2) { const k = backOut((t - 46.4) / 0.4); o2.save(); o2.translate(W / 2, 470); o2.scale(k, k); o2.shadowColor = 'rgba(0,0,0,0.6)'; o2.shadowBlur = 24; txt('GÖREV KABUL', 0, 0, 110, 900, '#ffd166', 'center', DISP, 6); o2.restore(); }
  if (t > 50.4) cinemaText(t, 51.0, 60, 'HEDEF: UZAY', 'DEVAM EDECEK', 520);
  if (t > 55.0) { const a = seg(t, 55, 55.8); o2.save(); o2.globalAlpha = a; txt('Bölüm 2 · Uzay Paspası', W / 2, 760, 50, 700, '#fff', 'center', BODY, 2); o2.restore(); }
  letterbox(0.0);
  subtitles(t);
  // cut flashes / fades
  for (const c of [4.6, 11.2, 21.4, 28.6, 35.4, 43.8, 50.2]) { const d = Math.abs(t - c); if (d < 0.25) { o2.fillStyle = `rgba(0,0,0,${(1 - d / 0.25) * 0.95})`; o2.fillRect(0, 0, W, H); } }
  const black = Math.max(1 - seg(t, 0, 0.6), seg(t, DUR - 0.8, DUR)); if (black > 0) { o2.fillStyle = `rgba(0,0,0,${black})`; o2.fillRect(0, 0, W, H); }
  grain(t, 0.06);
}

function renderFrame(i) {
  const t = i / FPS;
  render3D(t);
  o2.drawImage(renderer.domElement, 0, 0, W, H);
  overlays(t);
}
window.VIDEO = { FPS, DUR, NF };
window.renderFrame = renderFrame;
window.dbg = (t) => { render3D(t); const b = new THREE.Box3().setFromObject(ham.root); return { cam: camera.position.toArray().map(v=>+v.toFixed(2)), min: b.min.toArray().map(v=>+v.toFixed(2)), max: b.max.toArray().map(v=>+v.toFixed(2)), root: ham.root.position.toArray() }; };
await document.fonts.ready;
window.ready = true;
if (location.hash !== '#render') {
  let start = null;
  const loop = now => { if (start === null) start = now; renderFrame(Math.floor((now - start) / 1000 * FPS) % NF); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
